name: Promote develop to master

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin master
          git fetch origin develop

      - name: Create promotion branch
        run: |
          git checkout -B promotion/develop-to-master origin/master

      - name: Merge develop
        run: |
          git merge origin/develop --no-edit

      - name: Restore master-only files
        run: |
          git checkout origin/master -- \
            ph-css/pom.xml \
            ph-csscompress-maven-plugin/pom.xml \
            pom.xml

          git add \
            ph-css/pom.xml \
            ph-csscompress-maven-plugin/pom.xml \
            pom.xml

          if ! git diff --cached --quiet; then
            git commit -m "Keep master-only files unchanged"
          fi

      - name: Push promotion branch
        run: |
          git push --force origin promotion/develop-to-master

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head promotion/develop-to-master \
            --title "Promote develop to master" \
            --body "Automatic promotion of develop to master."
