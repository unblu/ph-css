name: Promote to upstream

on:
  schedule:
    # Check for a manually-created upstream PR every 5 minutes
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_REPO: phax/ph-css
  TARGET_BRANCH: master

  SOURCE_REPO: unblu/ph-css
  SOURCE_BRANCH: master

  PROMOTION_BRANCH: promotion/master-to-upstream

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. GitHub App token for OUR repository
      # ------------------------------------------------------------

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PH_CSS_PROMOTION_APP_ID }}
          private-key: ${{ secrets.PH_CSS_PROMOTION_APP_KEY }}
          owner: unblu
          repositories: ph-css
          permission-contents: write
          permission-pull-requests: write

      # ------------------------------------------------------------
      # 3. Find manually-created upstream PR
      #
      # This is the important part.
      #
      # We query phax/ph-css instead of relying on a pull_request
      # event there.
      # ------------------------------------------------------------

      - name: Find manual upstream PR
        id: upstream_pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          PR_JSON=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "unblu:master" \
            --state open \
            --json number,title,body \
            --limit 1)

          echo "PR_JSON=${PR_JSON}" >> "$GITHUB_ENV"

          PR_NUMBER=$(echo "${PR_JSON}" | jq -r '.[0].number // empty')
          PR_TITLE=$(echo "${PR_JSON}" | jq -r '.[0].title // empty')
          PR_BODY=$(echo "${PR_JSON}" | jq -r '.[0].body // empty')

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          {
            echo 'title<<EOF'
            echo "${PR_TITLE}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo 'body<<EOF'
            echo "${PR_BODY}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 4. Configure git
      # ------------------------------------------------------------

      - name: Configure git
        run: |
          git config user.name "ph-css-promotion[bot]"
          git config user.email \
            "ph-css-promotion[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # 5. Add upstream remote
      # ------------------------------------------------------------

      - name: Add upstream remote
        run: |
          git remote add upstream \
            https://github.com/${TARGET_REPO}.git

          git fetch upstream ${TARGET_BRANCH}

      # ------------------------------------------------------------
      # 6. Create promotion branch from upstream/master
      # ------------------------------------------------------------

      - name: Create promotion branch
        run: |
          git checkout -B \
            "${PROMOTION_BRANCH}" \
            "upstream/${TARGET_BRANCH}"

      # ------------------------------------------------------------
      # 7. Merge source master
      # ------------------------------------------------------------

      - name: Merge source master
        run: |
          git merge \
            --no-commit \
            --no-ff \
            "origin/${SOURCE_BRANCH}"

      # ------------------------------------------------------------
      # 8. Restore upstream-owned files
      # ------------------------------------------------------------

      - name: Restore upstream-owned files
        run: |
          git restore \
            --source="upstream/${TARGET_BRANCH}" \
            -- \
            .github/workflows/ \
            CLAUDE.md

      # ------------------------------------------------------------
      # 9. Commit promotion
      # ------------------------------------------------------------

      - name: Commit promotion
        run: |
          git add -A

          git commit \
            -m "Promote master to upstream/master" \
            || echo "Nothing to commit"

      # ------------------------------------------------------------
      # 10. Push promotion branch to OUR repository
      # ------------------------------------------------------------

      - name: Push promotion branch
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${SOURCE_REPO}.git" \
            "${PROMOTION_BRANCH}" \
            --force

      # ------------------------------------------------------------
      # 11. Find existing controlled promotion PR
      # ------------------------------------------------------------

      - name: Find promotion PR
        id: promotion_pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "unblu:${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 12. Create controlled promotion PR
      # ------------------------------------------------------------

      - name: Create promotion PR
        if: steps.promotion_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

          PR_TITLE: ${{ steps.upstream_pr.outputs.title }}
          PR_BODY: ${{ steps.upstream_pr.outputs.body }}
          SOURCE_PR_NUMBER: ${{ steps.upstream_pr.outputs.number }}

        run: |
          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE="Promote master to upstream"
          fi

          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${TARGET_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr create \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "unblu:${PROMOTION_BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md

      # ------------------------------------------------------------
      # 13. Update existing controlled promotion PR
      # ------------------------------------------------------------

      - name: Update promotion PR
        if: steps.promotion_pr.outputs.number != '' && steps.upstream_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

          PR_TITLE: ${{ steps.upstream_pr.outputs.title }}
          PR_BODY: ${{ steps.upstream_pr.outputs.body }}
          SOURCE_PR_NUMBER: ${{ steps.upstream_pr.outputs.number }}

        run: |
          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${TARGET_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr edit \
            "${{ steps.promotion_pr.outputs.number }}" \
            --repo "${TARGET_REPO}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md

      # ------------------------------------------------------------
      # 14. Close manual PR
      # ------------------------------------------------------------

#      - name: Close manual upstream PR
#        if: steps.upstream_pr.outputs.number != ''
#        env:
#          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
#        run: |
#          gh pr close \
#            "${{ steps.upstream_pr.outputs.number }}" \
#            --repo "${TARGET_REPO}" \
#            --comment \
#              "This direct promotion PR is replaced by the automated promotion PR."
