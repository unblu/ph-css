name: Promote to upstream

on:
  schedule:
    # Check for a manually-created upstream PR every 5 minutes
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_REPO: phax/ph-css
  TARGET_BRANCH: master

  SOURCE_REPO: unblu/ph-css
  SOURCE_BRANCH: master

  PROMOTION_BRANCH: promotion/master-to-upstream

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Find manually-created upstream PR
      #
      # We deliberately do this FIRST.
      #
      # If no manual PR exists, this workflow does nothing.
      # ------------------------------------------------------------

      - name: Find manual upstream PR
        id: upstream_pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          echo "Looking for manual PR: ${SOURCE_REPO}:${SOURCE_BRANCH} -> ${TARGET_REPO}:${TARGET_BRANCH}"

          PR_JSON=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json number,title,body,headRefName,headRepositoryOwner,headRepository \
            --limit 100)

          echo "Open upstream PRs:"
          echo "${PR_JSON}" | jq .

          PR=$(echo "${PR_JSON}" | jq -c \
            --arg owner "unblu" \
            --arg repo "ph-css" \
            --arg branch "master" \
            '
            map(
              select(
                .headRefName == $branch and
                .headRepositoryOwner.login == $owner and
                .headRepository.name == $repo
              )
            )
            | .[0] // empty
            ')

          if [ -z "${PR}" ]; then
            echo "No manual upstream PR found."
            exit 0
          fi

          PR_NUMBER=$(echo "${PR}" | jq -r '.number')
          PR_TITLE=$(echo "${PR}" | jq -r '.title')
          PR_BODY=$(echo "${PR}" | jq -r '.body')

          echo "Found manual upstream PR #${PR_NUMBER}"
          echo "Title: ${PR_TITLE}"

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          {
            echo 'title<<EOF'
            echo "${PR_TITLE}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo 'body<<EOF'
            echo "${PR_BODY}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. Generate GitHub App token for OUR repository
      # ------------------------------------------------------------

      - name: Generate GitHub App token
        if: steps.upstream_pr.outputs.number != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PH_CSS_PROMOTION_APP_ID }}
          private-key: ${{ secrets.PH_CSS_PROMOTION_APP_KEY }}
          owner: unblu
          repositories: ph-css
          permission-contents: write
          permission-pull-requests: write

      # ------------------------------------------------------------
      # 3. Checkout source repository
      # ------------------------------------------------------------

      - name: Checkout source
        if: steps.upstream_pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ------------------------------------------------------------
      # 4. Configure git
      # ------------------------------------------------------------

      - name: Configure git
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git config user.name "ph-css-promotion[bot]"
          git config user.email \
            "ph-css-promotion[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # 5. Add upstream remote
      # ------------------------------------------------------------

      - name: Add upstream remote
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git remote add upstream \
            https://github.com/${TARGET_REPO}.git

          git fetch upstream ${TARGET_BRANCH}

      # ------------------------------------------------------------
      # 6. Create promotion branch from upstream/master
      # ------------------------------------------------------------

      - name: Create promotion branch
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git checkout -B \
            "${PROMOTION_BRANCH}" \
            "upstream/${TARGET_BRANCH}"

      # ------------------------------------------------------------
      # 7. Merge source master
      # ------------------------------------------------------------

      - name: Merge source master
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git merge \
            --no-commit \
            --no-ff \
            "origin/${SOURCE_BRANCH}"

      # ------------------------------------------------------------
      # 8. Restore upstream-owned files
      # ------------------------------------------------------------

      - name: Restore upstream-owned files
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git restore \
            --source="upstream/${TARGET_BRANCH}" \
            -- \
            .github/workflows/ \
            CLAUDE.md

      # ------------------------------------------------------------
      # 9. Commit promotion
      # ------------------------------------------------------------

      - name: Commit promotion
        if: steps.upstream_pr.outputs.number != ''
        run: |
          git add -A

          git commit \
            -m "Promote master to upstream/master" \
            || echo "Nothing to commit"

      # ------------------------------------------------------------
      # 10. Push promotion branch to OUR repository
      # ------------------------------------------------------------

      - name: Push promotion branch
        if: steps.upstream_pr.outputs.number != ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${SOURCE_REPO}.git" \
            "${PROMOTION_BRANCH}" \
            --force

      # ------------------------------------------------------------
      # 11. Find existing controlled promotion PR
      # ------------------------------------------------------------

      - name: Find promotion PR
        if: steps.upstream_pr.outputs.number != ''
        id: promotion_pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "unblu:${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 12. Create controlled promotion PR
      #
      # Title and body come from the manual upstream PR.
      # ------------------------------------------------------------

      - name: Create promotion PR
        if: >
          steps.upstream_pr.outputs.number != '' &&
          steps.promotion_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

          PR_TITLE: ${{ steps.upstream_pr.outputs.title }}
          PR_BODY: ${{ steps.upstream_pr.outputs.body }}
          SOURCE_PR_NUMBER: ${{ steps.upstream_pr.outputs.number }}

        run: |
          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE="Promote master to upstream"
          fi

          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${SOURCE_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr create \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "unblu:${PROMOTION_BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md

      # ------------------------------------------------------------
      # 13. Update existing controlled promotion PR
      #
      # Keeps title/body synchronized with the manual PR.
      # ------------------------------------------------------------

      - name: Update promotion PR
        if: >
          steps.upstream_pr.outputs.number != '' &&
          steps.promotion_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

          PR_TITLE: ${{ steps.upstream_pr.outputs.title }}
          PR_BODY: ${{ steps.upstream_pr.outputs.body }}
          SOURCE_PR_NUMBER: ${{ steps.upstream_pr.outputs.number }}

        run: |
          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE="Promote master to upstream"
          fi

          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${SOURCE_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr edit \
            "${{ steps.promotion_pr.outputs.number }}" \
            --repo "${TARGET_REPO}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md
