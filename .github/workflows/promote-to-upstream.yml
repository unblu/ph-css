name: Promote to upstream

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_REPO: phax/ph-css
  TARGET_BRANCH: master

  SOURCE_REPO: unblu/ph-css
  SOURCE_BRANCH: master

  PROMOTION_BRANCH: promotion/master-to-upstream

jobs:
  promote:
    # Only react to PRs:
    #
    #   master -> master
    #
    # in the source repository.
    if: >
      github.event.pull_request.head.ref == 'master' &&
      github.event.pull_request.base.ref == 'master'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout source master
      # ------------------------------------------------------------

      - name: Checkout source master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Generate GitHub App installation token
      #
      # This token is used ONLY for operations on unblu/ph-css.
      # ------------------------------------------------------------

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PH_CSS_PROMOTION_APP_ID }}
          private-key: ${{ secrets.PH_CSS_PROMOTION_APP_KEY }}
          owner: unblu
          repositories: ph-css
          permission-contents: write
          permission-pull-requests: write

      # ------------------------------------------------------------
      # 3. Configure git
      # ------------------------------------------------------------

      - name: Configure git
        run: |
          git config user.name "ph-css-promotion[bot]"
          git config user.email \
            "ph-css-promotion[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # 4. Add upstream remote and fetch upstream master
      # ------------------------------------------------------------

      - name: Add upstream remote
        run: |
          git remote add upstream \
            https://github.com/${TARGET_REPO}.git

          git fetch upstream ${TARGET_BRANCH}

      # ------------------------------------------------------------
      # 5. Create promotion branch from upstream/master
      # ------------------------------------------------------------

      - name: Create promotion branch
        run: |
          git checkout -B \
            "${PROMOTION_BRANCH}" \
            "upstream/${TARGET_BRANCH}"

      # ------------------------------------------------------------
      # 6. Merge source master
      # ------------------------------------------------------------

      - name: Merge source master
        run: |
          git merge \
            --no-commit \
            --no-ff \
            "origin/${SOURCE_BRANCH}"

      # ------------------------------------------------------------
      # 7. Restore files that are owned by upstream
      # ------------------------------------------------------------

      - name: Restore upstream-owned workflow files
        run: |
          git restore \
            --source="upstream/${TARGET_BRANCH}" \
            -- \
            .github/workflows/ \
            CLAUDE.md

      # ------------------------------------------------------------
      # 8. Commit promotion branch
      # ------------------------------------------------------------

      - name: Commit promotion
        run: |
          git add -A

          git commit \
            -m "Promote master to upstream/master" \
            || echo "Nothing to commit"

      # ------------------------------------------------------------
      # 9. Push promotion branch to OUR repository
      #
      # IMPORTANT:
      # Use the GitHub App token, not github.token.
      # ------------------------------------------------------------

      - name: Push promotion branch
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${SOURCE_REPO}.git" \
            "${PROMOTION_BRANCH}" \
            --force

      # ------------------------------------------------------------
      # 10. Find existing upstream promotion PR
      #
      # This uses UPSTREAM_TOKEN because the PR belongs to
      # phax/ph-css.
      # ------------------------------------------------------------

      - name: Find promotion PR
        id: promotion_pr
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${SOURCE_REPO}:${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 11. Create upstream promotion PR
      #
      # Preserve original title and description.
      # ------------------------------------------------------------

      - name: Create promotion PR
        if: steps.promotion_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${SOURCE_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr create \
            --repo "${TARGET_REPO}" \
            --base "${TARGET_BRANCH}" \
            --head "${SOURCE_REPO}:${PROMOTION_BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md

      # ------------------------------------------------------------
      # 12. Update existing promotion PR
      #
      # Keeps title and description synchronized.
      # ------------------------------------------------------------

      - name: Update promotion PR
        if: steps.promotion_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          ${PR_BODY}

          ---

          Automatically promoted from:

          https://github.com/${SOURCE_REPO}/pull/${SOURCE_PR_NUMBER}
          EOF

          gh pr edit \
            "${{ steps.promotion_pr.outputs.number }}" \
            --repo "${TARGET_REPO}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/pr-body.md
