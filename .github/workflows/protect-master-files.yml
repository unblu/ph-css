name: Protect master files

on:
  pull_request:
    branches:
      - master

jobs:
  check-protected-files:
    name: Check protected master files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PROTECTED_FILES=(
            "ph-css/pom.xml"
            "ph-csscompress-maven-plugin/pom.xml"
            "pom.xml"
          )

          CHANGED_FILES=$(git diff \
            --name-only \
            "$BASE_SHA" \
            "$HEAD_SHA")

          for FILE in "${PROTECTED_FILES[@]}"; do
            if echo "$CHANGED_FILES" | grep -Fxq "$FILE"; then
              echo "ERROR: Protected file changed: $FILE"
              exit 1
            fi
          done

          echo "No protected master files were changed."
