name: Validate master PR

on:
  pull_request:
    branches:
      - master

jobs:
  validate-source:
    name: Validate master source
    runs-on: ubuntu-latest

    steps:
      - name: Require develop as source branch
        run: |
          SOURCE="${{ github.head_ref }}"

          if [ "$SOURCE" = "develop" ]; then
            echo "Valid: develop -> master"
            exit 0
          fi

          if [ "$SOURCE" = "sync/upstream-master" ]; then
            echo "Valid: upstream synchronization -> master"
            exit 0
          fi

          echo "ERROR: Only develop or sync/upstream-master may merge into master."
          exit 1
