name: Validate master PR

on:
  pull_request:
    branches:
      - master

jobs:
  validate-source:
    name: Validate master source
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        run: |
          SOURCE="${{ github.head_ref }}"

          case "$SOURCE" in
            promotion/develop-to-master)
              echo "Valid promotion branch."
              ;;

            sync/upstream-master)
              echo "Valid upstream synchronization branch."
              ;;

            develop)
              echo "ERROR: Direct develop -> master PR."
              echo "The promotion workflow must be used."
              exit 1
              ;;

            *)
              echo "ERROR: Invalid source branch: $SOURCE"
              exit 1
              ;;
          esac
