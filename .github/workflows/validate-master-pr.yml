name: Validate master PR

on:
  pull_request:
    branches:
      - master

jobs:
  validate-source:
    name: Validate master source
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        run: |
          SOURCE="${{ github.head_ref }}"

          if [ "$SOURCE" != "promotion/develop-to-master" ] &&
             [ "$SOURCE" != "sync/upstream-master" ]; then
            echo "ERROR: Only promotion or upstream-sync branches may merge into master."
            echo "Source branch: $SOURCE"
            exit 1
          fi

          echo "Valid source branch: $SOURCE"
